<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C4161C">
<title>Sem conexão — Sírio A&B</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;
    font-family:Verdana,Geneva,sans-serif;color:#2B2B2B;text-align:center;padding:1.5rem;box-sizing:border-box}
  .box{max-width:380px}
  img{width:96px;height:96px}
  h1{color:#e30017;font-size:1.3rem;margin:1rem 0 .5rem}
  p{font-size:.92rem;line-height:1.5;color:#4b4b4b;margin:0 0 1.4rem}
  button{background:#e30017;color:#fff;border:0;border-radius:8px;padding:.8rem 1.6rem;font-size:.95rem;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="Clube Sírio">
    <h1>Você está sem conexão</h1>
    <p>O sistema precisa de internet para carregar e salvar os dados. Verifique sua rede e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
